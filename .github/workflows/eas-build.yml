name: EAS build (optional)

# Cloud builds through Expo Application Services.
# Needs a repository secret EXPO_TOKEN (expo.dev > Account settings > Access tokens).
# Run it from the Actions tab and pick a profile.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview

jobs:
  eas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret to use EAS builds."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Link EAS project (first run only)
        run: eas init --non-interactive --force

      - name: Build Android (${{ inputs.profile }})
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
