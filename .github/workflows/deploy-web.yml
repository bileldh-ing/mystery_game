name: Deploy web to GitHub Pages

# Builds the web version and publishes it to the gh-pages branch,
# served at https://<user>.github.io/<repo>/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate-story

      - name: Serve under /<repo-name>/ on Pages
        run: |
          jq --arg base "/${GITHUB_REPOSITORY#*/}" '.expo.experiments.baseUrl = $base' app.json > app.tmp.json
          mv app.tmp.json app.json

      - name: Export web build
        run: npx expo export --platform web

      - name: SPA fallback + no Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
