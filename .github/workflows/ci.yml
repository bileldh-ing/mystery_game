name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, story validation, web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate story (references + 3,000 simulated playthroughs)
        run: npm run validate-story

      - name: Expo config doctor
        run: npx expo-doctor || echo "::warning::expo-doctor reported issues"

      - name: Export web build
        run: npx expo export --platform web

      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: dist
          retention-days: 7
